name: Deploy

# Deploys the pushed commit to the 0run.fun host. The image is built ON THE SERVER,
# so no production secret ever exists in this (public) repository or in CI logs.
#
# The test job below is intentionally a copy of ci.yml's rather than a reusable
# `uses:` call: the cross-workflow indirection failed to start any job at all
# ("workflow file issue", zero jobs) and a deploy gate that silently does not run
# is worse than a few duplicated lines.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (workspaces)
        # DATABASE_URL is deliberately unset: the db-backed test self-skips.
        run: npm run test --workspaces --if-present
      - name: Contract tests
        run: npx hardhat test
        working-directory: contracts
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/web
      - name: Build
        # The Privy app id is a public client-side identifier (it ships in the
        # browser bundle), so it lives in a repo variable rather than a secret.
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.NEXT_PUBLIC_PRIVY_APP_ID }}
        run: npm run build --workspace web

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate target revision
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          # Never interpolate context values straight into a shell command: bind to an
          # env var and validate the shape before it reaches the remote host.
          case "$TARGET_SHA" in
            [0-9a-f]*) [ ${#TARGET_SHA} -eq 40 ] || { echo "unexpected sha length"; exit 1; } ;;
            *) echo "sha is not lowercase hex"; exit 1 ;;
          esac
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /srv/0run/deploy/deploy.sh '$TARGET_SHA'"

      - name: Verify the site is serving the new revision
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 https://0run.fun/api/health | tee /tmp/health | grep -q '"ok":true'; then
              cat /tmp/health; exit 0
            fi
            sleep 6
          done
          echo "health endpoint did not report ok after deploy"; exit 1
