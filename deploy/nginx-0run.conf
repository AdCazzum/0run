# Host nginx vhost for 0run.fun -> the web container on loopback:3001.
# Installed once by deploy/bootstrap.sh; certbot --nginx adds the TLS block and redirect.
server {
    listen 80;
    listen [::]:80;
    server_name 0run.fun www.0run.fun;

    client_max_body_size 32m;   # GPX and Apple Health exports are uploaded as multipart

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 0G Storage uploads and TEE inference are slow: allow long responses.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
