<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>0run — cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1280px; height: 720px; background: #EFEFD0; color: #004E89; font-family: "Inter", sans-serif; overflow: hidden; }
  .frame { position: absolute; inset: 20px; border: 1px solid rgba(0,78,137,0.15); }
  .wrap { position: relative; width: 100%; height: 100%; padding: 64px 72px; display: flex; flex-direction: column; }
  .overline { display: flex; align-items: center; gap: 14px; }
  .overline::before { content: ""; height: 1px; width: 46px; background: #004E89; }
  .overline span { font-size: 12px; text-transform: uppercase; letter-spacing: 0.3em; color: #1A659E; }
  h1 { font-family: "Playfair Display", serif; font-weight: 400; font-size: 118px; line-height: 0.95; letter-spacing: -0.02em; margin-top: 44px; }
  h1 em { font-style: italic; color: #FF6B35; }
  .chips { display: flex; gap: 10px; margin-top: 46px; }
  .chip { padding: 8px 16px; border: 1px solid rgba(0,78,137,0.2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: #1A659E; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; font-size: 11px; text-transform: uppercase; letter-spacing: 0.25em; color: #1A659E; }
  .vertical { position: absolute; right: 44px; top: 64px; writing-mode: vertical-rl; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3em; color: #1A659E; }
  /* the mark: the zero as a track, the runner on it */
  .mark { position: absolute; right: 96px; bottom: -150px; width: 430px; height: 560px; transform: rotate(-10deg); }
</style>
</head>
<body>
  <div class="frame"></div>
  <svg class="mark" viewBox="0 0 430 560" aria-hidden="true">
    <path fill="#004E89" fill-rule="evenodd" d="
      M 215 10 A 205 270 0 1 0 215 550 A 205 270 0 1 0 215 10 Z
      M 215 50 A 111 229 0 1 1 215 508 A 111 229 0 1 1 215 50 Z"/>
    <circle cx="319" cy="94" r="40" fill="#FF6B35"/>
  </svg>
  <div class="wrap">
    <div class="overline"><span>0run — ETHGlobal Lisbon 2026</span></div>
    <h1>Own your <em>Coach.</em><br />Own your runs.</h1>
    <div class="chips">
      <span class="chip">Live — 0run.fun</span>
      <span class="chip">iNFT on 0G</span>
      <span class="chip">ENS · World</span>
    </div>
    <div class="foot"><span>The AI running coach you own</span></div>
  </div>
</body>
</html>
